<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>StrasbourgStarter logo</title>
<desc>Stork with Strasbourg cathedral in a circular terracotta badge</desc>

<circle cx="200" cy="200" r="195" fill="#C1734A"/>
<circle cx="200" cy="200" r="182" fill="#FFFDF9"/>
<circle cx="200" cy="200" r="152" fill="#FAF7F2"/>

<!-- Cathedral spire -->
<polygon points="196,82 204,82 208,130 192,130" fill="#C1734A"/>
<polygon points="200,75 207,88 193,88" fill="#C1734A"/>
<rect x="188" y="130" width="24" height="12" fill="#C1734A"/>
<!-- Cathedral tower -->
<rect x="178" y="142" width="44" height="52" fill="#C1734A"/>
<circle cx="200" cy="162" r="10" fill="#FAF7F2"/>
<!-- Side towers -->
<rect x="156" y="152" width="18" height="42" fill="#C1734A"/>
<polygon points="156,152 174,152 174,140 165,128 156,140" fill="#C1734A"/>
<rect x="226" y="152" width="18" height="42" fill="#C1734A"/>
<polygon points="226,152 244,152 244,140 235,128 226,140" fill="#C1734A"/>
<!-- Cathedral body -->
<rect x="148" y="194" width="104" height="40" fill="#C1734A"/>
<!-- Arched windows -->
<rect x="156" y="200" width="14" height="22" fill="#FAF7F2" rx="7"/>
<rect x="178" y="200" width="14" height="22" fill="#FAF7F2" rx="7"/>
<rect x="208" y="200" width="14" height="22" fill="#FAF7F2" rx="7"/>
<rect x="230" y="200" width="14" height="22" fill="#FAF7F2" rx="7"/>
<!-- Base -->
<rect x="143" y="234" width="114" height="7" fill="#C1734A" rx="2"/>

<!-- STORK -->
<ellipse cx="158" cy="218" rx="15" ry="19" fill="#FFFDF9"/>
<ellipse cx="158" cy="220" rx="12" ry="15" fill="#2C2825"/>
<ellipse cx="158" cy="215" rx="8" ry="11" fill="#FFFDF9"/>
<!-- Neck -->
<path d="M160,200 Q164,185 166,172" stroke="#FFFDF9" stroke-width="8" fill="none" stroke-linecap="round"/>
<!-- Head -->
<circle cx="167" cy="168" r="9" fill="#FFFDF9"/>
<circle cx="170" cy="166" r="2.2" fill="#2C2825"/>
<circle cx="170.8" cy="165.3" r="0.8" fill="#FFFDF9"/>
<!-- Beak -->
<polygon points="177,167 196,165 177,163" fill="#C1734A"/>
<!-- Legs -->
<line x1="163" y1="237" x2="165" y2="260" stroke="#C1734A" stroke-width="3.5" stroke-linecap="round"/>
<line x1="153" y1="237" x2="151" y2="260" stroke="#C1734A" stroke-width="3.5" stroke-linecap="round"/>
<!-- Feet -->
<line x1="165" y1="260" x2="173" y2="263" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="165" y1="260" x2="165" y2="265" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="165" y1="260" x2="157" y2="265" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="151" y1="260" x2="143" y2="263" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="151" y1="260" x2="151" y2="265" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="151" y1="260" x2="159" y2="265" stroke="#C1734A" stroke-width="2.5" stroke-linecap="round"/>

<!-- Ring text -->
<path id="topArc" d="M 30,200 A 170,170 0 0,1 370,200" fill="none"/>
<text font-family="Georgia, serif" font-size="13" font-weight="600" fill="#C1734A" letter-spacing="3.5">
  <textPath href="#topArc" startOffset="7%">STRASBOURGSTARTER.COM</textPath>
</text>
<path id="bottomArc" d="M 62,290 A 170,170 0 0,0 338,290" fill="none"/>
<text font-family="Georgia, serif" font-size="11" fill="#7A7068" letter-spacing="4">
  <textPath href="#bottomArc" startOffset="10%">YOUR STRASBOURG GUIDE</textPath>
</text>
</svg>
