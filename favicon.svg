<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<rect width="32" height="32" rx="6" fill="#C1734A"/>
<!-- Cathedral spire -->
<polygon points="15,2 17,2 18,10 14,10" fill="#FFFDF9"/>
<polygon points="16,0 18.5,4 13.5,4" fill="#FFFDF9"/>
<!-- Cathedral tower -->
<rect x="12" y="10" width="8" height="9" fill="#FFFDF9"/>
<circle cx="16" cy="14" r="2" fill="#C1734A"/>
<!-- Side towers -->
<rect x="8" y="12" width="4" height="7" fill="#FFFDF9"/>
<polygon points="8,12 12,12 12,9 10,6 8,9" fill="#FFFDF9"/>
<rect x="20" y="12" width="4" height="7" fill="#FFFDF9"/>
<polygon points="20,12 24,12 24,9 22,6 20,9" fill="#FFFDF9"/>
<!-- Cathedral body -->
<rect x="7" y="19" width="18" height="6" fill="#FFFDF9"/>
<!-- Stork body (simplified) -->
<ellipse cx="7" cy="21" rx="3" ry="4" fill="#2C2825"/>
<ellipse cx="7" cy="20" rx="2" ry="3" fill="#FFFDF9"/>
<!-- Stork head and beak -->
<circle cx="9" cy="16" r="2" fill="#FFFDF9"/>
<polygon points="11,15.5 16,15 11,16.5" fill="#C1734A"/>
<!-- Legs -->
<line x1="7" y1="25" x2="7" y2="30" stroke="#C1734A" stroke-width="1.2" stroke-linecap="round"/>
<line x1="5" y1="25" x2="5" y2="30" stroke="#C1734A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
